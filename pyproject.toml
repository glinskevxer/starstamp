[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "starstamp"
version = "1.0.0"
description = "Requalification shop records for DOT compressed gas cylinders"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Wasatch Cylinder Service" }]
keywords = ["cylinder", "requalification", "hydrostatic", "compressed gas", "DOT"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Manufacturing",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Typing :: Typed",
]
dependencies = ["click==8.1.8"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "coverage==7.6.12",
  "ruff==0.9.7",
  "mypy==1.15.0",
  "hypothesis==6.125.3",
]

[project.urls]
Documentation = "https://github.com/glinskevxer/starstamp/blob/main/docs/cli.md"

[project.scripts]
starstamp = "starstamp.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/starstamp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "ARG", "N", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["src/starstamp"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
