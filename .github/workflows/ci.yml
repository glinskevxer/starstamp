name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push to the same branch cancels the first: the shop only cares
  # about the state of the tip.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: the build's own command lines
        run: python -m starstamp.tools.check_workflow
      - name: the command reference matches the commands
        run: python -m starstamp.tools.generate_cli_reference --check
      - name: the repository's own house rules
        run: python -m starstamp.tools.check_repo
      - name: the domain reference matches the rules
        run: python -m starstamp.tools.generate_domain_reference --check

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: tests with a coverage floor
        run: pytest -q --cov --cov-config=pyproject.toml --cov-report=term-missing --cov-fail-under=97

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: apply every migration to a scratch book
        run: python -m starstamp.tools.check_migrations
      - name: every reference has something to look it up by
        run: python -m starstamp.tools.check_indexes

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: a day in the shop, through the installed console script
        run: scripts/smoke.sh "$(mktemp -d)"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build==1.2.2.post1
      - run: python -m build
      - name: the wheel has to carry the migrations
        run: |
          set -e
          python - <<'PY'
          import pathlib, zipfile
          wheel = sorted(pathlib.Path("dist").glob("*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          sql = [name for name in names if name.endswith(".sql")]
          assert sql, f"{wheel.name} carries no migrations"
          assert "starstamp/py.typed" in names, f"{wheel.name} is not marked as typed"
          print(f"{wheel.name}: {len(sql)} migrations, {len(names)} files")
          PY
